<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Judge's gavel icon">
  <defs>
    <linearGradient id="g-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="none">
    <!-- Gavel (rotated group) -->
    <g transform="rotate(-35 82 42)">
      <!-- Head -->
      <rect x="46" y="26" width="42" height="16" rx="3" fill="url(#g-head)"/>
      <!-- Cap -->
      <rect x="88" y="26" width="12" height="16" rx="3" fill="#b45309"/>
      <!-- Handle -->
      <rect x="78" y="40" width="14" height="58" rx="7" fill="#92400e"/>
    </g>

    <!-- Base/Strike block -->
    <rect x="18" y="92" width="58" height="10" rx="5" fill="#6b7280"/>
    <rect x="30" y="104" width="34" height="8" rx="4" fill="#6b7280"/>
  </g>
</svg>
