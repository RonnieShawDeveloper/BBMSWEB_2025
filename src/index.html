<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>BBMS - Bahama Bail Management System</title>
  <base href="/">
  <link rel="icon" href="assets/favicon.png" type="image/png">
</head>
<body style="background-color: white;">
<div id="splashscreen" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0; transition: opacity 500ms ease-in-out;">
  <img src="assets/img/app/splashscreen.png" alt="BBMS Logo" id="splash-logo">
</div>

<!-- Main Angular app root -->
<app-root style="display: none;"></app-root>

<noscript>Please enable JavaScript to continue using this application.</noscript>

<style>
  /* Fade-in effect for main app root */
  @keyframes fadeIn {
    0% {
      opacity: 0;
    }
    100% {
      opacity: 1;
    }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const splashscreen = document.getElementById('splashscreen');
    const appRoot = document.querySelector('app-root');

    // Initial state: hide app-root
    appRoot.style.display = 'none';

    // 1. Fade in splash screen (500ms)
    splashscreen.style.display = 'block'; // Ensure it's visible for animation
    setTimeout(() => {
      splashscreen.style.opacity = '1';
    }, 50); // Small delay to ensure CSS transition applies

    // 2. Show for 1000ms after fade-in completes
    // 3. Fade out splash screen (500ms)
    setTimeout(() => {
      splashscreen.style.opacity = '0';
    }, 500 + 2000); // 500ms (fade-in) + 2000ms (display)

    // 4. Hide splash screen and show app-root after fade-out completes
    setTimeout(() => {
      splashscreen.style.display = 'none';
      appRoot.style.display = 'block';
      // Optionally, if you want app-root to fade in as well:
      // appRoot.style.opacity = '0';
      // appRoot.style.transition = 'opacity 500ms ease-in-out';
      // setTimeout(() => { appRoot.style.opacity = '1'; }, 50);
    }, 500 + 2000 + 500); // Total duration
  });
</script>
</body>
</html>
