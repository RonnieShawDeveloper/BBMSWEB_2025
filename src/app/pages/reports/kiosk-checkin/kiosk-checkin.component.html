<section class="d-xl-flex flex-column justify-content-center align-items-center mb-5">
  <div class="row" style="width: 8.5in;">
    <div class="col-10" style="text-align: left;"><span style="font-weight: bold;font-size: 25px;">KIOSK CHECK-IN REPORT</span></div>
    <div class="col-2" style="text-align: right;"><button class="btn btn-primary btn-sm no-print" type="button" (click)="doExit()">EXIT</button></div>
  </div>
  <div class="row" style="width: 8.5in;">
    <div class="col" style="text-align: center;"><span style="font-weight: bold;">CRIMINAL REGISTRY</span></div>
  </div>
  <div class="row" style="width: 8.5in;">
    <div class="col" style="text-align: left;"><span>Report Date {{reportDate}}</span></div>
  </div>
  <div class="d-flex flex-row justify-content-center align-items-center text-center" style="width: 8.5in;">
    <div class="btn btn-primary btn-sm m-1" (click)="doNameSort()">SORT BY NAME AND DATE</div>
    <div class="btn btn-info btn-sm m-1" (click)="doDateSort()">SORT BY DATE</div>
  </div>
  <div style="width: 8.5in;">
    <div class="col" style="text-align: left;margin-top: 20px"><span class="font-weight-bold">{{checkins.length}} Total Check-ins in Database</span></div>
  </div>
  <div class="row" style="width: 8.5in;background: #e3e5e6">
    <div class="col d-flex align-items-center"><span>Defendants Name</span></div>
    <div class="col d-flex align-items-center"><span>Check-in Date</span></div>
    <div class="col"><span>Check-in Location</span></div>
  </div>
  <div class="row border-bottom border-dark" *ngFor="let c of checkins" style="width: 8.5in;">
    <div class="col d-flex align-items-center"><span>{{c.name}}</span></div>
    <div class="col d-flex align-items-center"><span>{{c.datetime}} (<b>{{c.dayOfWeek}}</b>)</span></div>
    <div class="col"><span>{{c.location}}</span></div>
  </div>
  <div style="height: 50px"></div>
</section>
