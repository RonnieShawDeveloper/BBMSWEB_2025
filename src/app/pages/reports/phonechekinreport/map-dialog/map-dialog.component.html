<div class="map-dialog">
  <div mat-dialog-title class="dialog-header">
    <div class="title-content">
      <mat-icon class="location-icon">📍</mat-icon>
      <h2>Check-in Location</h2>
    </div>
    <button mat-icon-button (click)="close()" class="close-button">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div mat-dialog-content class="dialog-content">
    <div class="checkin-info">
      <div class="info-row">
        <span class="label">👤 Offender:</span>
        <span class="value">{{data.checkin.fName}} {{data.checkin.lName}}</span>
      </div>
      <div class="info-row">
        <span class="label">🕐 Check-in Time:</span>
        <span class="value">{{getFormattedTimestamp()}}</span>
      </div>
      <div class="info-row">
        <span class="label">🚔 Police Station:</span>
        <span class="value">{{data.checkin.policestation}}</span>
      </div>
      <div class="info-row">
        <span class="label">📏 Distance:</span>
        <span class="value">{{data.checkin.distance}} feet</span>
      </div>
    </div>

    <div class="map-container">
      <iframe
        [src]="'https://maps.google.com/maps?q=' + data.checkin.lat + ',' + data.checkin.lon + '&hl=en&z=15&amp;output=embed' | safe:'resourceUrl'"
        width="100%"
        height="400"
        style="border:0;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        class="google-map">
      </iframe>
    </div>

    <div class="coordinates-info">
      <div class="coordinate-item">
        <span class="coord-label">🌐 Latitude:</span>
        <span class="coord-value">{{data.checkin.lat}}</span>
      </div>
      <div class="coordinate-item">
        <span class="coord-label">🌐 Longitude:</span>
        <span class="coord-value">{{data.checkin.lon}}</span>
      </div>
    </div>
  </div>

  <div mat-dialog-actions class="dialog-actions">
    <button mat-raised-button color="primary" (click)="openInGoogleMaps()">
      <mat-icon>open_in_new</mat-icon>
      Open in Google Maps
    </button>
    <button mat-button (click)="close()">
      Close
    </button>
  </div>
</div>
