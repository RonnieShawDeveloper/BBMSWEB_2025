<div class="container-fluid">
  <!-- Header Section -->
  <div class="row" style="border-bottom-style: solid; border-bottom-color: var(--dark);">
    <div class="col" style="text-align: center; font-size: 26px; font-weight: bold;">
      <span>OFFENDER INTAKE AND BOOKING RECORD</span>
    </div>
  </div>

  <!-- Search Component -->
  <app-intake-records-search
    *ngIf="showSearch"
    (offenderSelected)="onOffenderSelected($event)"
    (createOffender)="onCreateOffender($event)"
    (createTempAfis)="onCreateTempAfis()">
  </app-intake-records-search>

  <!-- Create Component -->
  <app-intake-records-create
    *ngIf="showCreate"
    [afisRecord]="selectedAfis"
    [tempAfisId]="tempAfisId"
    (offenderCreated)="onOffenderCreated($event)"
    (cancel)="onCreateClosed()">
  </app-intake-records-create>

  <!-- Details Component -->
  <app-intake-records-details
    *ngIf="showDetails"
    [offender]="selectedOffender"
    (bookingSelected)="onBookingSelected($event)"
    (createBooking)="onCreateBooking()"
    (close)="onDetailsClosed()">
  </app-intake-records-details>

  <!-- Booking Component -->
  <app-intake-records-booking
    *ngIf="showBooking"
    [booking]="selectedBooking"
    [offender]="selectedOffender"
    (close)="onBookingClosed()">
  </app-intake-records-booking>
</div>
